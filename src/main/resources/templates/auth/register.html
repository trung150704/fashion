<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/index :: dynamic(~{::main})}">
<body>
	<main>
	<br>
		<div class="login-container m-auto mb-5">
		    <!-- Welcome Section (trái) -->
		    <div class="welcome-section">
		      <div class="welcome-text">
		        <h1>Chào mừng!</h1>
		        <p>Bạn đã có tài khoản?</p>
		        <a th:href="@{/login}"><button class="btn-signup">Đăng nhập</button></a>
		      </div>
		    </div>
		
		    <!-- Form Section (phải) -->
		    <div class="form-section">
		      <div class="form-wrapper">
		        <h2>Tạo tài khoản</h2>
		        <div class="social-buttons">
		          <button><i class="fab fa-facebook-f"></i></button>
		          <button><i class="fab fa-google"></i></button>
		        </div>
		        <form th:action="@{/register}" method="post" th:object="${user}">
				  <!-- Username -->
				  <div class="form-group">
				    <label for="username">Tài khoản</label>
				    <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="Tài khoản" />
				    <div th:if="${#fields.hasErrors('username')}" class="error-box">
				      <i class="fas fa-exclamation-circle"></i>
				      <span th:errors="*{username}"></span>
				    </div>
				  </div>
				
				  <!-- Email -->
				  <div class="form-group">
				    <label for="email">Email</label>
				    <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="Email" />
				    <div th:if="${#fields.hasErrors('email')}" class="error-box">
				      <i class="fas fa-exclamation-circle"></i>
				      <span th:errors="*{email}"></span>
				    </div>
				  </div>
				
				  <!-- Password -->
				  <div class="form-group">
				    <label for="password">Mật khẩu</label>
				    <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Mật khẩu" />
				    <div th:if="${#fields.hasErrors('password')}" class="error-box">
				      <i class="fas fa-exclamation-circle"></i>
				      <span th:errors="*{password}"></span>
				    </div>
				  </div>
				
				  <button type="submit" class="btn-login">Đăng ký</button>
				</form>


		      </div>
		    </div>
		  </div>
	</main>
</body>
</html>
