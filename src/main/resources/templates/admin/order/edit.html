<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/dashboard :: dynamic(~{::content})}">
<body th:fragment="content">
    <form th:action="@{'/admin/orders/edit/' + ${orders.id}}" th:object="${orders}" method="post">
        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

        <h1>Mã đơn hàng: <span th:text="${orders.id}"></span></h1>

        <div class="row">
            <div class="col-md-6">
			    <label>Tài khoản</label>
			    <select th:field="*{user.id}" class="form-control">
			        <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
			    </select>
			</div>
	

            <div class="col-md-6">
                <label>Ngày đặt hàng</label>
                <input type="text" th:field="*{order_date}" class="form-control"/>
            </div>

            <div class="col-md-6">
			    <label>Trạng thái</label>
			    <select th:field="*{status}" class="form-control">
			        <option value="delivered" th:text="'Đã giao'"></option>
			        <option value="cancel" th:text="'Đã hủy'"></option>
			        <option value="paid" th:text="'Đã thanh toán'"></option>
			        <option value="pending" th:text="'Chờ xử lý'"></option>
			    </select>
			</div>


            <div class="col-md-6">
                <label>Tổng tiền</label>
                <input type="number" th:field="*{total_price}" class="form-control"/>
            </div>

            <div class="col-md-6">
                <label>Địa chỉ</label>
                <input type="text" th:field="*{address}" class="form-control"/>
            </div>

            <div class="col-md-6">
                <label>Phương thức thanh toán</label>
                <input type="text" th:field="*{payment_method}" class="form-control"/>
            </div>

            <div class="col-md-6">
                <label>Tên người nhận</label>
                <input type="text" th:field="*{recipient_name}" class="form-control"/>
                <p class="text-danger" th:if="${#fields.hasErrors('recipient_name')}" th:errors="*{recipient_name}"></p>
            </div>

            <div class="col-md-6">
                <label>SĐT người nhận</label>
                <input type="text" th:field="*{recipient_phone}" class="form-control"/>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Cập nhật</button>
            <a th:href="@{/admin/orders}" class="btn btn-secondary">Quay lại</a>
        </div>
    </form>
</body>
</html>
