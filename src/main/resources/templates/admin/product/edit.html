<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/dashboard :: dynamic(~{::content})}">
<body th:fragment="content">	
	
    <form th:action="@{'/admin/product/edit/' + ${product.id}}"
          th:object="${product}"
          method="post"
          enctype="multipart/form-data">
		<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
		
        <h1>Chỉnh sửa sản phẩm: <span th:text="${product.name}"></span></h1>

        <div class="col-12 d-flex">
	        <!-- Tên sản phẩm -->
	        <div class="col-6">
	            <label>Tên sản phẩm</label>
	            <input type="text" th:field="*{name}" class="form-control"/>
	            <p class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
	        </div>
			
			<!-- Giá -->
	        <div class="col-6">
	            <label>Giá (chỉ nhập số)</label>
	            <input type="text" th:field="*{price}" class="form-control"/>
	            <p class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
	        </div>
        </div>
        <div class="col-12 d-flex">
	        <!-- Số lượng tồn kho -->
	        <div class="col-6">
	            <label>Số lượng</label>
	            <input type="number" th:field="*{stock_quantity}" class="form-control"/>
	            <p class="text-danger" th:if="${#fields.hasErrors('stock_quantity')}" th:errors="*{stock_quantity}"></p>
	        </div>
	         <!-- Danh mục (Category) -->
	        <div class="col-6">
	            <label>Danh mục</label>
	            <select th:field="*{category.id}" class="form-control">
	                <option th:each="cate : ${categories}" th:value="${cate.id}" th:text="${cate.name}" 
	                        th:selected="${cate.id == product.category.id}"></option>
	            </select>
	        </div>
        </div>
        
        <!-- Ảnh sản phẩm -->
        <div>
            <label>Hình ảnh</label>
            <img class="border rounded m-3" th:src="@{'/images/' + ${product.image}}" alt="Product Image" width="150" th:if="${product.image != null}"/>
            <input type="file" name="imageFile" class="form-control"/>
        </div>
		
	   <!-- Mô tả -->
       <div>
            <label>Mô tả</label>
            <textarea th:field="*{description}" class="form-control"></textarea>
            <p class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>
		
        <!-- Submit -->
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Cập nhật</button>
            <a th:href="@{/admin/products}" class="btn btn-secondary">Quay lại danh sách sản phẩm</a>
        </div>
    </form>
</body>
</html>
