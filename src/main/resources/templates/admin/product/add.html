<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/dashboard :: dynamic(~{::content})}">
<body th:fragment="content">
<div class="container mt-4">
    <h2 class="mb-4">Thêm sản phẩm mới</h2>

    <form th:action="@{/admin/add}" th:object="${product}" method="post" class="needs-validation" novalidate enctype="multipart/form-data">
        <div class="form-group mb-3">
            <label for="name">Tên sản phẩm</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Nhập tên sản phẩm" required />
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group mb-3">
            <label for="description">Mô tả</label>
            <textarea th:field="*{description}" class="form-control" id="description" rows="3" placeholder="Mô tả sản phẩm"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="form-group mb-3">
            <label for="category">Danh mục</label>
            <select th:field="*{category.id}" class="form-select" id="category" required>
                <option value="" disabled selected>-- Chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>

        <div class="form-group mb-3">
            <label for="price">Giá</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" id="price" placeholder="Nhập giá" required />
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="form-group mb-3">
            <label for="stock_quantity">Số lượng tồn</label>
            <input type="number" th:field="*{stock_quantity}" class="form-control" id="stock_quantity" required />
            <div class="text-danger" th:if="${#fields.hasErrors('stock_quantity')}" th:errors="*{stock_quantity}"></div>
        </div>

        <div class="form-group mb-3">
		    <label for="imageFile">Ảnh sản phẩm</label>
		    <input type="file" name="imageFile" class="form-control" id="imageFile" />
		    <div class="text-danger" th:if="${errorImage}" th:text="${errorImage}"></div>
		</div>



        <button type="submit" class="btn btn-primary">Thêm mới</button>
        <a th:href="@{/admin/products}" class="btn btn-secondary ms-2">Quay lại danh sách</a>
    </form>
</div>
</body>
</html>
