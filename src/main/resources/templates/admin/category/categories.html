<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/dashboard :: dynamic(~{::content})}">
<body  th:fragment="content">
<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="d-flex">
    <h1 class="col-8">Danh sách danh mục</h1>
    <div class="col-4"> <a th:href="@{/admin/categories/add}"><button class="btn btn-primary">Thêm danh mục</button> </a> </div></div>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên Danh mục</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${categories}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
				<td class="d-flex float-end">
				    <a th:href="@{/admin/categories/edit/{id}(id=${c.id})}" class="btn btn-sm btn-primary ">
					    <i class="bi bi-pen"></i> Sửa
					</a>
					<a th:href="@{/admin/categories/delete/{id}(id=${c.id})}" 
					  class="btn btn-sm btn-danger" 
					  onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">
					  <i class="bi bi-trash"></i> Xóa
					</a>
				</td>                
            </tr>
        </tbody>
    </table>
</body>
</html>
