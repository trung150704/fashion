<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org" th:fragment="dynamic(main)" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/images/logo.png">
    <title th:text="${pageTitle}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/thankyou.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <!-- <script src="https://cdn.tailwindcss.com"></script>  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
	<script src="/js/app.js"></script>	
	<script src="/js/checkout.js"></script>
</head>
<body ng-app="shopApp" ng-controller="CartController">
    <div class="col-12 d-flex justify-content-center text-center bg-dark">
        <h5 class="text-light m-1 p-1">Giảm giá 20% cho đơn hàng đầu tiên.</h5>
        <a th:href="@{/login}" class="text-light m-1 p-1">Đăng nhập ngay</a>
    </div>

    <div th:replace="~{layout/header :: header}"></div>

    <div class="container mt-3">
        <div th:replace="${main}"></div> 
    </div> 
	
    <div th:replace="~{layout/footer :: footer}"></div>
    <button class="bg-light" onclick="scrollToTop()" id="scrollTopBtn" title="Lên đầu trang">⬆</button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/js.js}"></script>
</body>
</html>
