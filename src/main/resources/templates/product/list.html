<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/index :: dynamic(~{::main})}">

<body>
<main class="container mt-4">
	<!-- Nút xổ form -->
<button class="btn btn-outline-primary mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#filterForm" aria-expanded="false" aria-controls="filterForm">
    🔍 Bộ lọc sản phẩm
</button>

<!-- Form lọc -->
<div class="collapse" id="filterForm">
    <form method="get" action="/products" class="p-4 mb-4 border rounded bg-light">
        <h4 class="mb-4">Tìm kiếm & Lọc theo giá</h4>

        <div class="row gx-3">
            <!-- Tên sản phẩm -->
            <div class="col-md-6">
                <label for="keyword" class="form-label">Tên sản phẩm</label>
                <input type="text" id="keyword" name="keyword" class="form-control" placeholder="VD: sơ mi, polo..." th:value="${param.keyword}">
            </div>

            <!-- Mức giá -->
            <div class="col-md-6">
                <label for="priceRange" class="form-label">Mức giá</label>
                <select id="priceRange" name="priceRange" class="form-select">
                    <option value="">Chọn mức giá</option>
                    <option value="0-200000" th:selected="${param.priceRange == '0-200000'}">Dưới 200.000đ</option>
                    <option value="200000-500000" th:selected="${param.priceRange == '200000-500000'}">200.000đ - 500.000đ</option>
                    <option value="500000-1000000" th:selected="${param.priceRange == '500000-1000000'}">500.000đ - 1.000.000đ</option>
                    <option value="1000000-99999999" th:selected="${param.priceRange == '1000000-99999999'}">Trên 1.000.000đ</option>
                </select>
            </div>

            <!-- Nút lọc -->
            <div class="col-md-4 d-flex align-items-end mt-3">
                <button type="submit" class="btn btn-primary w-100">Lọc</button>
            </div>
        </div>
    </form>
</div>

    <div class="row">
        <!-- Product List -->
        <div class="col-md-3">
        <div class="col-md-6">Cao - thấp</div>
        <div class="col-md-6">Thấp - cao</div>
        </div>
        <div class="col-md-12">
            <div class="row row-cols-2 row-cols-md-4 g-4">
                <div th:each="p : ${products}" class="col">
				    <div class="card h-100 product-card position-relative overflow-hidden border-0 shadow-sm">
				        <a th:href="@{/products/{id}(id=${p.id})}">
				            <div class="product-image-wrapper">
				                <img th:src="@{/images/{images}(images=${p.image})}" class="product-image" alt="Product Image">
				                <div class="buy-now-overlay">
				                    <a class="btn btn-warning" th:href="@{/products/{id}(id=${p.id})}">Mua ngay</a>
				                </div>
				            </div>
				        </a>
				        <div class="card-body text-center">
				            <h5 class="card-title text-muted" th:text="${p.name}"></h5>
				            <p class="card-text fw-bold mb-0">
				                <span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT')}"></span> VNĐ
				            </p>
				        </div>
				    </div>
				</div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
    <!-- PHÂN TRANG -->
		<nav aria-label="Page navigation">
		    <ul class="pagination">
		        <!-- Nút Previous -->
		        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
		            <a class="page-link" 
		               th:href="@{/products(page=${currentPage - 1})}">
		               <i class="bi bi-arrow-left"></i>
		            </a>
		        </li>

		        <!-- Hiển thị số trang -->
		        <li class="page-item" 
		            th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
		            th:classappend="${i == currentPage} ? 'active'">
		            <a class="page-link" 
		               th:href="@{/products(page=${i})}"
		               th:text="${i + 1}">1</a>
		        </li>

		        <!-- Nút Next -->
		        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
		            <a class="page-link" 
		               th:href="@{/products(page=${currentPage + 1})}">
		                <i class="bi bi-arrow-right"></i>
		            </a>
		        </li>
		    </ul>
		</nav>
    </div>
</main>
</body>
</html>
