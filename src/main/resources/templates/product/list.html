<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/index :: dynamic(~{::main})}">
<body>
<main class="container product-list-page">
    <div class="product-list-hero">
        <div>
            <h1 th:text="${pageTitle ?: 'Tất cả sản phẩm'}">Tất cả sản phẩm</h1>
            <p class="text-muted mb-0">Những thiết kế dễ mặc, dễ phối cho phong cách riêng của bạn.</p>
        </div>
        <span class="product-count" th:text="${products.size() + (currentPage * 12)} + ' sản phẩm'">20 sản phẩm</span>
    </div>
    <div class="shop-toolbar">
        <button class="btn btn-filter" type="button" data-bs-toggle="collapse" data-bs-target="#filterForm"><i
                class="bi bi-sliders me-2"></i>Bộ lọc
        </button>
        <form method="get" th:action="@{/products}" class="sort-form"><label for="sort">Sắp xếp</label>
            <select id="sort"
                    name="sort"
                    class="form-select form-select-sm"
                    onchange="this.form.submit()">
                <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
                <option value="priceAsc" th:selected="${sort == 'priceAsc'}">Giá thấp đến cao</option>
                <option value="priceDesc" th:selected="${sort == 'priceDesc'}">Giá cao đến thấp</option>
            </select>
        </form>
    </div>
    <div class="collapse" id="filterForm">
        <form method="get" th:action="@{/products}" class="filter-panel row g-3">
            <div class="col-md-6">
                <label class="form-label" for="keyword">Tên sản phẩm</label>
                <input id="keyword"
                       name="keyword"
                       class="form-control"
                       placeholder="Ví dụ: sơ mi, jean..."
                       th:value="${param.keyword}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="priceRange">Khoảng giá</label>
                <select id="priceRange"
                        name="priceRange"
                        class="form-select">
                    <option value="">Tất cả mức giá</option>
                    <option value="0-200000" th:selected="${param.priceRange == '0-200000'}">Dưới 200.000đ</option>
                    <option value="200000-500000" th:selected="${param.priceRange == '200000-500000'}">200.000đ – 500.000đ</option>
                    <option value="500000-1000000" th:selected="${param.priceRange == '500000-1000000'}">Trên 500.000đ</option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label mb-2 d-none d-md-block">&nbsp;</label>
                <button class="btn btn-primary w-100" type="submit" >Áp dụng</button>
            </div>
        </form>
    </div>
    <div th:if="${#lists.isEmpty(products)}" class="empty-products"><i class="bi bi-search"></i>
        <h3>Không tìm thấy sản phẩm</h3>
        <p>Thử từ khóa hoặc khoảng giá khác nhé.</p>
        <a class="btn btn-outline-dark" th:href="@{/products}">Xem tất cả</a>
    </div>
    <div class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-4 mt-1" th:unless="${#lists.isEmpty(products)}">
        <div class="col" th:each="p : ${products}">
            <article class="card product-card h-100">
                <a class="product-image-wrapper" th:href="@{/products/{id}(id=${p.id})}">
                    <img th:src="@{${p.image}}" th:alt="${p.name}" class="product-image">
                    <span
                            class="product-quick">Xem sản phẩm <i class="bi bi-arrow-up-right"></i>
                    </span>
                </a>
                <div class="card-body"><p class="product-category" th:text="${p.category.name}">Danh mục</p>
                    <h2 class="product-name" th:text="${p.name}">Tên sản phẩm</h2>
                    <div class="d-flex justify-content-between align-items-center">
                        <strong class="product-price"
                                th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT') + ' đ'}">199.000 đ
                        </strong>
                        <a class="product-add" th:href="@{/products/{id}(id=${p.id})}"
                           aria-label="Xem chi tiết"><i class="bi bi-plus"></i>
                        </a>
                    </div>
                </div>
            </article>
        </div>
    </div>
    <nav class="d-flex justify-content-center mt-5" th:if="${totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link"
                                                                                       th:href="@{/products(page=${currentPage - 1}, keyword=${param.keyword}, priceRange=${param.priceRange}, sort=${sort})}"><i
                    class="bi bi-arrow-left"></i></a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'"><a class="page-link"
                                                                   th:href="@{/products(page=${i}, keyword=${param.keyword}, priceRange=${param.priceRange}, sort=${sort})}"
                                                                   th:text="${i + 1}">1</a></li>
            <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'"><a class="page-link"
                                                                                                    th:href="@{/products(page=${currentPage + 1}, keyword=${param.keyword}, priceRange=${param.priceRange}, sort=${sort})}"><i
                    class="bi bi-arrow-right"></i></a></li>
        </ul>
    </nav>
</main>
</body>
</html>
