<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/index :: dynamic(~{::main})}">
<body>
    <main>
        <div class="col-12 m-2 d-flex">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{|/products|}">Sản Phẩm</a>
                    </li>  
                    <li class="breadcrumb-item">
					    <a th:href="@{/category/{id}(id=${product.category.id})}" th:text="${product.category.name}"></a>
					</li>
                    <li class="breadcrumb-item active fw-bold" th:text="${product.name}"></li>
                </ol>
            </nav>
        </div>

        <div class="row d-flex">
            <div class="col-md-6">
                <img th:src="@{/images/{image}(image=${product.image})}" class="img-fluid w-100 product-img" alt="Product Image" />
            </div>
            
            <div class="col-md-6">
                <div class="product-details">
                    <div class="d-flex">
                        <h2 class="w-100" th:text="${product.name}"> </h2>
                        <a th:href="@{/}"><i class="bi bi-heart flex-shrink-1"></i></a>
                    </div>
                    <p>Mã sản phẩm: <strong th:text="${product.id}"></strong></p>
                    <p>Giá: <span class="price-tag" th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')}"></span> VNĐ</p>
	                <div>
					    <p id="selected-size" style="margin-top: 10px; font-size: 1.2em; font-weight: bold;">Kích cỡ: </p>
					    <div class="size-grid" style="display: flex; gap: 10px; margin-top: 10px;">
					        <div th:each="s : ${size}"
					             th:text="${s.name}"
					             class="size-option"
					             style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border: 1px solid black; border-radius: 5px; cursor: pointer;"
					             onclick="selectSize(this)"
					             th:attr="ng-click=|selectSize('${s.name}')|">
					        </div>
					    </div>
					</div>
					<div class="mt-4 d-flex align-items-center">
					    <label class="me-2 fw-bold" for="quantityInput">Số lượng:</label>
					    <input type="number" id="quantityInput" name="quantity" min="1" value="1" ng-model="quantity" ng-init="quantity = 1"
					           class="form-control" style="width: 100px;">
					</div>
					<div class="mt-4">
					<strong class="mb-2">Mô tả</strong>
					<hr>
					<p class="mt-2 text-muted" th:text="${product.description}"></p>
					</div>
                    <button class="btn btn-primary mt-3"
					    th:attr="ng-click=|addToCart(${product.id}, '${product.name}', ${product.price}, '${product.image}')|">
					    <i class="fa fa-shopping-cart"></i> Thêm vào giỏ hàng
					</button>
                </div>
            </div>
        </div>
        
        <h2 id="related-products" class="mt-5 mb-4">Sản phẩm liên quan</h2>

		<div class="row row-cols-2 row-cols-md-4 g-4">
		    <div class="col" th:each="p : ${relatedProducts}">
		        <div class="card h-100 shadow-sm product-card">
		            <div class="product-image-wrapper">
				                <img th:src="@{/images/{images}(images=${p.image})}" class="product-image" alt="Product Image">
				                <div class="buy-now-overlay">
				                    <a class="btn btn-warning" th:href="@{/products/{id}(id=${p.id})}">Mua ngay</a>
				                </div>
				            </div>
		            <div class="card-body">
		            	<hr>
		                <h5 class="card-title text-muted" th:text="${p.name}">Tên sản phẩm</h5>
		                <p><span class="card-text fw-bold mb-0" th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')}"></span> VNĐ</p>
		            </div>
		        </div>
		    </div>
		</div>
		
		<!-- Phân trang -->
		<div class="d-flex justify-content-center mt-4">
		    <nav>
		        <ul class="pagination">
		            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
		                <a class="page-link"
		                   th:href="@{|/products/${product.id}?page=${currentPage - 1}#related-products|}">◀ </a>
		            </li>
		            <li class="page-item" th:classappend="${!relatedProducts.hasNext()} ? 'disabled'">
		                <a class="page-link"
		                   th:href="@{|/products/${product.id}?page=${currentPage + 1}#related-products|}"> ▶</a>
		            </li>
		        </ul>
		    </nav>
		</div>

    </main>
</body>
</html>
