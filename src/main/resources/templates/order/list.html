<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/index :: dynamic(~{::main})}">

<body>
    <main class="container py-5">
    <h2 class="mb-4">Danh sách đơn hàng</h2>
    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle text-center">
            <thead class="table-primary">
                <tr>
                    <th>Người nhận</th>
                    <th>SĐT</th>
                    <th>Ngày đặt</th>
                    <th>Trạng thái</th>
                    <th>Tổng tiền</th>
                    <th>Địa chỉ</th>
                    <th>Thanh toán</th>
                    <th>Chi tiết</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.recipient_name}"></td>
                    <td th:text="${order.recipient_phone}"></td>
                    <td th:text="${#temporals.format(order.order_date, 'dd-MM-yyyy HH:mm')}"></td>
                    <td>
                        <span th:switch="${order.status}">
                            <span th:case="'delivered'" class="badge bg-success">Đã giao</span>
                            <span th:case="'cancel'" class="badge bg-danger">Đã hủy</span>
                            <span th:case="'pending'" class="badge bg-warning text-dark">Chờ xử lý</span>
                            <span th:case="'paid'" class="badge bg-primary">Đã thanh toán</span>
                            <span th:case="*" class="badge bg-secondary">Không xác định</span>
                        </span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(order.total_price, 1, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td th:text="${order.address}"></td>
                    <td th:text="${order.payment_method}"></td>
                    <td><a th:href="@{/order-list/{id}(id=${order.id})}" class="text-primary"><i class="bi bi-eye-fill"></i></a></td>
                </tr>
                <tr th:if="${orders.size() == 0}">
                    <td colspan="8" class="text-center text-muted">Chưa có đơn hàng nào</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
