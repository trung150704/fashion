<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/index :: dynamic(~{::main})}">

<body>
<main class="container py-5">
    <!-- Form -->
    <section class="mb-4">
        <form class="row g-3" th:action="@{/order/lookup}" method="get">
            <div class="col-md-2">
                <input type="text" name="orderId" class="form-control" placeholder="Nhập mã đơn hàng" required>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary">Tra cứu</button>
            </div>
        </form>
    </section>

    <!-- Không tìm thấy -->
    <div th:if="${notFound}" class="alert alert-danger">
        Không tìm thấy đơn hàng với mã: <strong th:text="${searchedId}"></strong>
    </div>

    <!-- Thông tin -->
    <div th:if="${order != null}" class="row g-4">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-primary text-white">Thông tin đơn hàng</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><strong>Mã đơn:</strong> <span th:text="${order.id}"></span></li>
                    <li class="list-group-item"><strong>Người nhận:</strong> <span th:text="${order.recipient_name}"></span></li>
                    <li class="list-group-item"><strong>SĐT:</strong> <span th:text="${order.recipient_phone}"></span></li>
                    <li class="list-group-item"><strong>Địa chỉ:</strong> <span th:text="${order.address}"></span></li>
                    <li class="list-group-item"><strong>Phương thức thanh toán:</strong> <span th:text="${order.payment_method}"></span></li>
                    <li class="list-group-item"><strong>Trạng thái:</strong>
                        <span th:switch="${order.status}">
                            <span th:case="'delivered'" class="badge bg-success">Đã giao</span>
                            <span th:case="'cancel'" class="badge bg-danger">Đã hủy</span>
                            <span th:case="'pending'" class="badge bg-warning text-dark">Chờ xử lý</span>
                            <span th:case="*" class="badge bg-secondary">Không xác định</span>
                        </span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-info text-white">Chi tiết sản phẩm</div>
                <div class="table-responsive">
                    <table class="table table-bordered align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Mã SP</th>
                                <th>Tên</th>
                                <th>Kích cỡ</th>
                                <th>Số lượng</th>
                                <th>Đơn giá</th>
                                <th>Thành tiền</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="detail : ${order.orderDetails}">
                                <td th:text="${detail.product.id}"></td>
                                <td th:text="${detail.product.name}"></td>
                                <td th:text="${detail.size.name}"></td>
                                <td th:text="${detail.quantity}"></td>
                                <td th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td th:text="${#numbers.formatDecimal(detail.price * detail.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer text-end">
                    <h5 class="mb-0">Tổng tiền: <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(order.total_price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></h5>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
