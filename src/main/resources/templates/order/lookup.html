<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/index :: dynamic(~{::main})}">
<main class="container py-5">
<div class="text-center mb-4"><h2>Tra cứu đơn hàng</h2><p class="text-muted">Nhập mã đơn hàng và số điện thoại đặt hàng</p></div>
<form class="row g-3 justify-content-center mb-4" th:action="@{/order/lookup}" method="get">
<div class="col-md-4"><label for="orderCode" class="form-label">Mã đơn hàng</label><input id="orderCode" name="orderCode" class="form-control" placeholder="FS-ABC1234567" required th:value="${searchedCode}"></div>
<div class="col-md-4"><label for="phone" class="form-label">Số điện thoại</label><input id="phone" name="phone" type="tel" class="form-control" placeholder="Số điện thoại đặt hàng" required></div>
<div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Tra cứu</button></div></form>
<div th:if="${notFound}" class="alert alert-danger">Không tìm thấy đơn hàng phù hợp.</div>
<div th:if="${order != null}" class="card shadow-sm"><div class="card-header bg-primary text-white">Thông tin đơn hàng</div><div class="card-body">
<p><strong>Mã đơn:</strong> <span th:text="${order.orderCode}"></span></p><p><strong>Người nhận:</strong> <span th:text="${order.recipient_name}"></span></p><p><strong>SĐT:</strong> <span th:text="${order.recipient_phone}"></span></p><p><strong>Địa chỉ:</strong> <span th:text="${order.address}"></span></p><p><strong>Trạng thái:</strong> <span class="badge bg-secondary" th:text="${order.status}"></span></p>
<hr><h5 class="text-end">Tổng tiền: <span class="text-danger" th:text="${#numbers.formatDecimal(order.total_price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></h5></div></div>
</main></html>
